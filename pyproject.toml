[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalgate"
version = "0.1.0"
description = "Release gate for nondeterministic software, a five layer eval pyramid"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eranga Mapa" }]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "scipy>=1.11",
  "jinja2>=3.1",
  "sportsbook-contracts",
]

[project.optional-dependencies]
judge = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["evalgate"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"evalgate/report.py" = ["E501"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
